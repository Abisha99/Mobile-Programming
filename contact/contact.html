<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #status {
            margin-top: 15px;
            text-align: center;
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Contact Us</h2>

        <form id="contactForm">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter your mobile number"
                    required>
            </div>

            <div class="form-group">
                <label for="gmail">Email Address</label>
                <input
                    type="email"
                    id="gmail"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea
                    id="message"
                    rows="5"
                    placeholder="Write your message"
                    required></textarea>
            </div>

            <button type="submit">Send Message</button>

        </form>

        <p id="status"></p>
    </div>

    <!-- Firebase JavaScript -->
    <script type="module" src="contact.js"></script>

</body>
</html>
